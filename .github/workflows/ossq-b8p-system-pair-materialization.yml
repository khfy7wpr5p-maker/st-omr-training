name: OSSQ B8P System Pair Materialization

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ossq-b8p-system-pair-materialization.yml'
      - 'ci/b8p_materialize_ossq_system_pairs.py'
      - 'evidence/ossq_b8n_source_byte_pins.json'
      - 'evidence/ossq_b8o_pairing_preflight.json'
      - 'evidence/ossq_b8p_system_pair_materialization.json'
      - 'st_omr_training/poly_v2_ossq_system_pair_materialization.py'
      - 'st_omr_training/poly_v2_ossq_pairing_preflight.py'
      - 'tests/test_poly_v2_ossq_system_pair_materialization.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ossq-b8p-system-pair-materialization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    name: Reproduce exact OSSQ system image and MusicXML pairs
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout ST-OMR training
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout exact OSSQ camera-ready source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MALerLab/ossq-omr
          ref: 7a17e45cddc0b7064fc3a179b62caeb57595e993
          path: _b8p/ossq
          persist-credentials: false

      - name: Checkout exact OSSQ preprocessor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MALerLab/omr-data-preprocessor
          ref: bdea0d1829c9db84480ebd2e0385f6f5fe324274
          path: _b8p/preprocessor
          submodules: recursive
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10.12'

      - name: Verify runner toolchain
        run: |
          python --version
          uv --version
          git -C _b8p/ossq rev-parse HEAD
          git -C _b8p/preprocessor rev-parse HEAD
          test "$(git -C _b8p/ossq rev-parse HEAD)" = "7a17e45cddc0b7064fc3a179b62caeb57595e993"
          test "$(git -C _b8p/preprocessor rev-parse HEAD)" = "bdea0d1829c9db84480ebd2e0385f6f5fe324274"

      - name: Install exact preprocessor lock
        working-directory: _b8p/preprocessor
        run: uv sync --frozen

      - name: Reproduce and hash exact B8P system pairs
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: >-
          python ci/b8p_materialize_ossq_system_pairs.py
          --dataset-root _b8p/ossq
          --preprocessor-root _b8p/preprocessor
