name: OSSQ B8O Pairing Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ossq-b8o-pairing-preflight.yml'
      - 'ci/b8o_verify_ossq_pairing_preflight.py'
      - 'evidence/ossq_b8n_source_byte_pins.json'
      - 'evidence/ossq_b8o_pairing_preflight.json'
      - 'st_omr_training/poly_v2_ossq_pairing_preflight.py'
      - 'st_omr_training/poly_v2_ossq_source_byte_pin.py'
      - 'tests/test_poly_v2_ossq_pairing_preflight.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ossq-b8o-pairing-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact OSSQ pairing-source metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Fetch and verify exact OSSQ alignment/MusicXML metadata
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python ci/b8o_verify_ossq_pairing_preflight.py
