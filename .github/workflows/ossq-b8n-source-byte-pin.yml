name: OSSQ B8N Source Byte Pin

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ossq-b8n-source-byte-pin.yml'
      - 'ci/b8n_pin_ossq_sources.py'
      - 'evidence/ossq_b8n_source_byte_pins.json'
      - 'st_omr_training/poly_v2_ossq_source_byte_pin.py'
      - 'st_omr_training/poly_v2_ossq_rights_evidence_batch1.py'
      - 'tests/test_poly_v2_ossq_source_byte_pin.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ossq-b8n-source-pin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    name: Verify exact OSSQ source PDF bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Fetch and hash exact B8M-reviewed source PDFs
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python ci/b8n_pin_ossq_sources.py
