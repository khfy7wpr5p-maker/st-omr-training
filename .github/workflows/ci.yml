name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu -r requirements-training.txt

      - name: Verify pinned runtime dependencies
        run: |
          python - <<'PY'
          from importlib import metadata
          expected = {
              "lxml": "6.1.1",
              "verovio": "6.2.1",
              "CairoSVG": "2.8.2",
              "Pillow": "12.3.0",
              "torch": "2.13.0+cpu",
          }
          for package, version in expected.items():
              actual = metadata.version(package)
              if actual != version:
                  raise SystemExit(f"{package}: expected {version}, got {actual}")
              print(f"{package}=={actual}")
          PY
          python -m pip check

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q st_omr_training tests

  stage7c-benchmark:
    name: Stage 7-C guarded runtime benchmark
    if: >-
      github.repository == 'khfy7wpr5p-maker/st-omr-training' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 23
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}

    steps:
      - name: Checkout exact PR source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Admit the one guarded execution commit
        id: gate
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "run(stage7c): benchmark and train exact head" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Guarded benchmark skipped for this commit."
          fi

      - name: Set up Python 3.13
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install exact dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu -r requirements-training.txt

      - name: Run conservative Stage 7-C benchmark
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python -m st_omr_training.stage7c_benchmark \
            --workspace "$RUNNER_TEMP/stage7c-benchmark-workspace" \
            --output "$RUNNER_TEMP/stage7c-benchmark.json"

      - name: Upload benchmark evidence
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7c-benchmark-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/stage7c-benchmark.json
          if-no-files-found: warn
          retention-days: 30

  stage7c-authoritative-training:
    name: Stage 7-C one-shot authoritative training
    needs:
      - test
      - stage7c-benchmark
    if: needs.stage7c-benchmark.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: Checkout exact benchmarked PR source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu -r requirements-training.txt

      - name: Verify exact pinned runtime
        run: |
          python - <<'PY'
          from st_omr_training.stage7c_execution import verify_stage7c_runtime
          print(verify_stage7c_runtime())
          PY
          python -m pip check

      - name: Run exact frozen synthetic-only Stage 7-C training
        run: |
          python -m st_omr_training.stage7c_cli \
            --workspace "$RUNNER_TEMP/stage7c-authoritative-workspace" \
            > "$RUNNER_TEMP/stage7c-authoritative-summary.json"

      - name: Upload authoritative run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage7c-authoritative-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/stage7c-authoritative-summary.json
            ${{ runner.temp }}/stage7c-authoritative-workspace
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
